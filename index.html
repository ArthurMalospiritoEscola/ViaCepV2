<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API CEPs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <main class="container">
        <h1>Consultador de CEPs V2</h1>
        <p class="subtítulo">Colsulte qualquer endereço e CEP do Brasil without us!!!!! p: </p>
        <!--Form-->
        <form id="formBusca" class="busca-box" onsubmit="event.preventDefault();">
            <div class="campo">
                <label for="uf">Estado(UF):</label>
                <select name="uf" id="uf" required>
                    <option value="" selected disabled>Selecione o estado...</option>
                    <option value="AC">AC</option>
                    <option value="AL">AL</option>
                    <option value="AP">AP</option>
                    <option value="AM">AM</option>
                    <option value="BA">BA</option>
                    <option value="CE">CE</option>
                    <option value="DF">DF</option>
                    <option value="ES">ES</option>
                    <option value="GO">GO</option>
                    <option value="MA">MA</option>
                    <option value="MT">MT</option>
                    <option value="MS">MS</option>
                    <option value="MG">MG</option>
                    <option value="PA">PA</option>
                    <option value="PB">PB</option>
                    <option value="PR">PR</option>
                    <option value="PE">PE</option>
                    <option value="PI">PI</option>
                    <option value="RJ">RJ</option>
                    <option value="RN">RN</option>
                    <option value="RS">RS</option>
                    <option value="RO">RO</option>
                    <option value="RR">RR</option>
                    <option value="SC">SC</option>
                    <option value="SP">SP</option>
                    <option value="SE">SE</option>
                    <option value="TO">TO</option>
                </select>
            </div>
            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" placeholder="Digite o nome da cidade..." minlength="3">
            </div>
            <div class="campo">
                <label for="rua">Rua/Logradouro:</label>
                <input type="text" id="rua" placeholder="Digite a sua rua/logradouro..." minlength="3">
            </div>



            <button type="submit" id="btnBuscar">Buscar</button>
        </form>

        <!--Mensagens -->
        <div id="mensagem" class="mensagem oculto">

        </div>

        <!--Resultado-->
        <div class="resultado oculto" id="resultado">
            <h3>Resultados encontrados:</h3>
            <div id="listaResultados" class="lista-resultados">

            </div>
        </div>
        
        <footer>
            Documentação Oficial: <a href="http://viacep.com.br/" target="_blank" rel="noopener noreferrer">ViaCep</a>
        </footer>
    </main>


    <script src="script.js"></script>
</body>
</html>
